[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "riscv-processor-verification"
version = "1.0.0"
description = "Differential verification toolkit for an educational RV32I subset"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<0.120", "uvicorn[standard]>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27,<1"]

[project.scripts]
riscv-verify = "riscv_verify.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
